[project]
name = "a2u-tasks"
version = "0.0.0"
description = "DBOS task workers, triggers and approvals."
requires-python = ">=3.12"
dependencies = ["a2u-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2u_tasks"]

[tool.uv.sources]
a2u-core = { workspace = true }
