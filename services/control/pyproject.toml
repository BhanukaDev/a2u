[project]
name = "a2u-control"
version = "0.0.0"
description = "Control API: orgs, workspaces, agents, versions, deploys, metering, evals."
requires-python = ">=3.12"
dependencies = ["a2u-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2u_control"]

[tool.uv.sources]
a2u-core = { workspace = true }
