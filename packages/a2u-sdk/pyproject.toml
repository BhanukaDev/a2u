[project]
name = "a2u-sdk"
version = "0.0.0"
description = "Code-agent API on top of a2u-core."
requires-python = ">=3.12"
dependencies = ["a2u-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2u_sdk"]

[tool.uv.sources]
a2u-core = { workspace = true }
