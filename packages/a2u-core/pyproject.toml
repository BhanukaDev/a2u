[project]
name = "a2u-core"
version = "0.0.0"
description = "A2U brain: front agent, router, flows, worker contract, memory, rendering, and the reliability harness."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2u_core"]
