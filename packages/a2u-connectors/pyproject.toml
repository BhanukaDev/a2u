[project]
name = "a2u-connectors"
version = "0.0.0"
description = "Built-in connectors: calendar, CRM, sheets, REST."
requires-python = ">=3.12"
dependencies = ["a2u-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2u_connectors"]

[tool.uv.sources]
a2u-core = { workspace = true }
